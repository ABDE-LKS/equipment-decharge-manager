services:
  postgres:
    image: postgres:16-alpine
    container_name: equipment_decharge_postgres
    restart: always
    environment:
      POSTGRES_DB: dechargedb
      POSTGRES_USER: decharge_user
      POSTGRES_PASSWORD: decharge_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_decharge_data:/var/lib/postgresql/data

volumes:
  postgres_decharge_data:
